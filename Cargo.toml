[package]
name = "nvidia-key-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
warp = "0.3"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dotenvy = "0.15"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
futures-util = "0.3"
tokio-stream = "0.1"
fastrand = "2.0"
bytes = "1"
http = "0.2"
http-body = "0.4"
lazy_static = "1.4"
serde_json = "1"
regex = "1"
